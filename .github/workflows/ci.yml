name: AgentForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint:
    name: Backend — Python Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Verify all agent modules compile
        run: |
          cd backend
          python -m py_compile app/main.py
          python -m py_compile app/agents/supervisor.py
          python -m py_compile app/agents/planner.py
          python -m py_compile app/agents/architect.py
          python -m py_compile app/agents/coder.py
          python -m py_compile app/agents/tester.py
          python -m py_compile app/agents/debugger.py
          python -m py_compile app/agents/reviewer.py
          python -m py_compile app/agents/docgen.py
          python -m py_compile app/agents/deployer.py
          python -m py_compile app/graph/state.py
          python -m py_compile app/graph/workflow.py
          python -m py_compile app/services/workspace.py
          python -m py_compile app/services/memory.py
          echo "✅ All 14 backend modules compiled successfully!"

  frontend-build:
    name: Frontend — TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: TypeScript check & production build
        run: |
          cd frontend
          npm run build
          echo "✅ Frontend built successfully!"

  docker-build:
    name: Docker — Compose Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose config
        run: docker compose config
